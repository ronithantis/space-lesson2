*,*::before,*::after{ box-sizing:border-box; }
html,body{ height:100%; margin:0; }
html{ background:var(--bg); }
body{ background:var(--bg); color:var(--ink); font-family:"Heebo",system-ui,"Segoe UI",Arial,sans-serif; font-weight:400; line-height:1.5; -webkit-font-smoothing:antialiased; overflow:hidden; }
#stars{ position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; }
.app{ position:relative; z-index:1; height:100vh; height:100dvh; display:grid; grid-template-rows:var(--hh) 1fr var(--fh); padding:0 clamp(14px,2.4vw,32px); }

header{ display:flex; align-items:center; justify-content:space-between; gap:16px; }
h1{ margin:0; font-weight:700; font-size:clamp(1.3rem,3.4vh,1.9rem); line-height:1.15; }
.sub{ margin:2px 0 0; color:var(--muted); font-size:clamp(.95rem,2.3vh,1.08rem); }
.hside{ display:flex; align-items:center; gap:14px; }
.count{ font-weight:500; color:var(--gold); font-size:clamp(1rem,2.5vh,1.15rem); white-space:nowrap; }
.chip{ font:inherit; font-weight:500; font-size:.92rem; color:var(--muted); background:var(--glass); border:1px solid var(--line); border-radius:999px; padding:6px 14px; cursor:pointer; white-space:nowrap; }
.chip:hover{ color:var(--ink); border-color:rgba(216,180,106,.5); }

main{ min-height:0; position:relative; }
.view{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
.view[hidden]{ display:none; }
footer{ display:flex; align-items:center; justify-content:center; gap:16px; }

.btn{ font:inherit; font-weight:500; font-size:1rem; padding:9px 24px; border-radius:999px; cursor:pointer; border:1px solid var(--gold); background:var(--gold); color:#1b1407; transition:background-color .2s, opacity .2s; white-space:nowrap; }
.btn:hover{ background:#e4c27c; }
.btn.ghost{ background:transparent; color:var(--ink); border-color:var(--line); }
.btn.ghost:hover{ border-color:var(--gold); }
.btn:disabled{ opacity:.35; cursor:default; }
.link{ font:inherit; font-size:.95rem; color:var(--muted); background:none; border:0; padding:4px 6px; cursor:pointer; text-decoration:underline; text-underline-offset:3px; text-decoration-color:rgba(151,164,186,.5); }
.link:hover{ color:var(--ink); }
:is(.btn,.chip,.link,.thumb,.card,.tcard,.target):focus-visible{ outline:2px solid var(--gold); outline-offset:3px; }

/* ---------- Stage 1: grid ---------- */
.grid{ --t:min(calc((100vh - var(--hh) - var(--fh) - 110px) / 2), 27vw, 250px); display:grid; grid-template-columns:repeat(3, var(--t)); gap:clamp(12px,2.6vh,22px) clamp(14px,2.4vw,28px); }
.thumb{ all:unset; cursor:pointer; display:flex; flex-direction:column; gap:8px; border-radius:12px; }
.thumb .frame{ position:relative; width:var(--t); aspect-ratio:1/1; border-radius:12px; overflow:hidden; border:1px solid var(--line); box-shadow:0 20px 50px rgba(0,0,0,.45); transition:border-color .2s, transform .2s; }
.thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
.thumb:hover .frame{ border-color:rgba(216,180,106,.6); transform:translateY(-2px); }
.thumb .nm{ display:flex; align-items:center; justify-content:space-between; gap:8px; font-weight:500; font-size:clamp(1rem,2.4vh,1.1rem); padding:0 2px; }
.seen{ display:inline-flex; align-items:center; gap:6px; font-size:.88rem; font-weight:500; color:var(--gold); }
.seen::before{ content:""; width:8px; height:8px; border-radius:50%; background:var(--gold); box-shadow:0 0 8px rgba(216,180,106,.7); }
.thumb.is-seen .frame{ border-color:rgba(216,180,106,.45); }

/* ---------- Stage 1: infographic ---------- */
.info{ position:relative; width:100%; height:100%; display:grid; grid-template-columns:minmax(300px, 1fr) auto; gap:clamp(24px,4vw,64px); align-items:center; padding:10px 0; }
.icol{ display:flex; flex-direction:column; gap:12px; min-width:0; max-width:460px; justify-self:end; width:100%; height:100%; justify-content:center; }
.icol h2{ margin:0; font-weight:700; font-size:clamp(1.4rem,3.8vh,2rem); line-height:1.15; }
.parts{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:clamp(8px,1.6vh,12px); }
.parts[hidden]{ display:none; }
.part{ position:relative; padding:10px 14px; border-radius:10px; background:var(--glass); -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); border:1px solid var(--line); transition:opacity .35s, border-color .3s, transform .35s; }
.part.off{ opacity:0; transform:translateX(8px); pointer-events:none; }
.part.cur{ border-color:var(--gold); }
.part b{ display:block; font-weight:700; font-size:1.05rem; color:var(--ink); }
.part.cur b{ color:var(--gold); }
.part span{ display:block; font-size:1rem; color:#cfd8e6; line-height:1.45; }
.part .ins{ font-size:.88rem; color:var(--muted); }
.summary{ padding:18px 20px; border-radius:12px; background:var(--glass); -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); border:1px solid rgba(216,180,106,.45); }
.summary[hidden]{ display:none; }
.summary dl{ margin:0; display:grid; gap:12px; }
.summary dt{ font-weight:500; color:var(--gold); font-size:.98rem; }
.summary dd{ margin:2px 0 0; font-size:1.02rem; color:var(--ink); line-height:1.5; }
.summary dd .orb{ color:var(--muted); }
.dist{ position:relative; height:26px; margin:6px 0 2px; }
.dist .trk{ position:absolute; top:12px; right:10px; left:0; height:2px; background:rgba(190,210,240,.18); }
.dist .fill{ position:absolute; top:12px; right:10px; height:2px; background:var(--gold); width:calc((100% - 10px) * var(--p)); }
.dist .earth{ position:absolute; top:4px; right:0; width:18px; height:18px; border-radius:50%; background:radial-gradient(circle at 35% 35%, #7fb6ff, #1d4f8f 70%); box-shadow:0 0 8px rgba(80,150,255,.5); }
.dist .sat{ position:absolute; top:7px; width:12px; height:12px; margin-right:-6px; border-radius:50%; background:var(--gold); box-shadow:0 0 8px rgba(216,180,106,.7); right:calc(10px + (100% - 10px) * var(--p)); }
.dist .tick{ position:absolute; top:8px; width:1px; height:10px; background:rgba(190,210,240,.35); right:calc(10px + (100% - 10px) * var(--p)); }
.dist-note{ display:block; font-size:.85rem; color:var(--muted); margin-top:2px; }
.extra{ padding:16px 18px; border-radius:12px; background:var(--glass); -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); border:1px solid rgba(216,180,106,.45); display:flex; flex-direction:column; gap:10px; }
.extra[hidden]{ display:none; }
.extra .intro{ margin:0; font-size:1rem; color:#cfd8e6; }
.extra h4{ margin:0; font-size:1rem; font-weight:500; color:var(--gold); }
.res{ display:grid; grid-template-columns:auto 1fr; gap:8px 12px; align-items:center; }
.res canvas{ width:64px; height:64px; border-radius:6px; border:1px solid var(--line); image-rendering:pixelated; }
.res b{ display:block; font-weight:700; font-size:.98rem; }
.res span{ display:block; font-size:.92rem; color:#cfd8e6; line-height:1.4; }
.res .px{ grid-column:1 / -1; font-size:.85rem; color:var(--muted); }
.mil{ list-style:none; margin:0; padding:0; display:grid; gap:6px; }
.mil li{ font-size:.95rem; line-height:1.45; color:#cfd8e6; }
.mil li b{ color:var(--ink); font-weight:700; }

/* ---------- Sort screen ---------- */
.sort{ width:min(1120px,100%); height:100%; display:flex; flex-direction:column; justify-content:center; gap:clamp(14px,3vh,26px); }
.sort section{ background:var(--glass); -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); border:1px solid var(--line); border-radius:14px; padding:clamp(12px,2.2vh,18px) clamp(16px,2vw,24px); }
.sort h2{ margin:0 0 6px; font-size:clamp(1.05rem,2.6vh,1.2rem); font-weight:700; color:var(--gold); }
.scale{ position:relative; height:clamp(96px,16vh,120px); margin:0 70px 0 10px; }
.scale .trk{ position:absolute; bottom:22px; right:0; left:0; height:2px; background:rgba(190,210,240,.25); }
.scale .zone{ position:absolute; bottom:22px; height:2px; }
.scale .zone.low{ background:rgba(127,182,255,.6); }
.scale .zone.mid{ background:rgba(127,182,255,.35); }
.scale .zone.geo{ background:var(--gold); height:4px; bottom:21px; }
.scale .zl{ position:absolute; bottom:0; font-size:.88rem; color:var(--muted); white-space:nowrap; transform:translateX(50%); }
.scale .earthbig{ position:absolute; bottom:8px; right:-58px; width:30px; height:30px; border-radius:50%; background:radial-gradient(circle at 35% 35%, #7fb6ff, #1d4f8f 70%); box-shadow:0 0 12px rgba(80,150,255,.5); }
.scale .earthlbl{ position:absolute; bottom:-2px; right:-74px; font-size:.82rem; color:var(--muted); white-space:nowrap; }
.mk{ position:absolute; bottom:22px; }
.mk i{ position:absolute; bottom:0; right:-0.5px; width:1px; background:rgba(216,180,106,.6); }
.mk em{ position:absolute; right:-5px; bottom:-4px; width:10px; height:10px; border-radius:50%; background:var(--gold); }
.mk span{ position:absolute; font-style:normal; font-size:.95rem; font-weight:500; white-space:nowrap; transform:translateX(50%); }
.mk.edge span{ transform:translateX(100%); }
.mk.start span{ transform:none; }
.mk span small{ color:var(--muted); font-weight:400; font-size:.88rem; }
.olist{ display:grid; grid-template-columns:repeat(3,1fr); gap:clamp(10px,1.6vw,20px); margin-top:10px; }
.olist div b{ display:block; font-weight:700; font-size:.98rem; }
.olist div span{ display:block; font-size:.92rem; color:#cfd8e6; line-height:1.45; }
.olist .geo b{ color:var(--gold); }
.webbnote{ margin:8px 0 0; font-size:.9rem; color:var(--muted); }

.ictl{ display:flex; gap:10px; flex-wrap:wrap; margin-top:4px; }

.imgbox{ position:relative; height:min(100%, calc(100vh - var(--hh) - var(--fh) - 20px)); aspect-ratio:1/1; max-width:min(60vw, 100%); border-radius:14px; overflow:visible; }
.imgbox img{ width:100%; height:100%; object-fit:cover; display:block; border-radius:14px; border:1px solid var(--line); box-shadow:0 30px 80px rgba(0,0,0,.55); user-select:none; -webkit-user-drag:none; }
.credit{ position:absolute; left:10px; bottom:8px; z-index:4; font-size:.78rem; color:#dfe6f0; background:rgba(0,0,0,.55); padding:2px 8px; border-radius:6px; }
.pdot{ position:absolute; width:14px; height:14px; margin:-7px 0 0 -7px; border-radius:50%; background:var(--gold); border:2px solid #fff3d6; box-shadow:0 0 0 4px rgba(216,180,106,.25), 0 0 12px rgba(216,180,106,.6); transition:opacity .3s; z-index:3; }
.pdot.inside{ background:rgba(216,180,106,.25); border:2px dashed var(--gold); box-shadow:none; }
.pdot.off{ opacity:0; }
.edit .pdot{ cursor:grab; width:18px; height:18px; margin:-9px 0 0 -9px; opacity:1; }
#lines{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:2; overflow:visible; }
#lines line{ stroke:rgba(216,180,106,.75); stroke-width:1.2; }
#lines line.dash{ stroke-dasharray:4 4; }
#lines line.dim{ stroke:rgba(216,180,106,.35); }
.editbox{ display:flex; flex-direction:column; gap:6px; }
.editbox[hidden]{ display:none; }
.editbox textarea{ width:100%; height:84px; font:inherit; font-size:.8rem; direction:ltr; text-align:left; color:var(--ink); background:rgba(0,0,0,.4); border:1px solid var(--line); border-radius:8px; padding:8px; resize:vertical; }

/* ---------- Stage 2 ---------- */
.match{ width:100%; height:100%; display:grid; grid-template-columns:minmax(300px, 420px) auto; gap:clamp(24px,4vw,60px); align-items:center; justify-content:center; }
.deck{ display:flex; flex-direction:column; gap:14px; }
.deck h2{ margin:0; font-weight:700; font-size:clamp(1.2rem,3.2vh,1.6rem); line-height:1.25; }
.deck .sub{ margin:0; }
.pile{ position:relative; min-height:clamp(150px,28vh,200px); }
.pile::before, .pile::after{ content:""; position:absolute; inset:0; border-radius:14px; border:1px solid var(--line); background:rgba(8,15,30,.5); }
.pile::before{ transform:translate(-8px,8px); }
.pile::after{ transform:translate(-4px,4px); }
.pile.empty::before, .pile.empty::after{ display:none; }
.pile.one::before{ display:none; }
.tcard{ position:relative; z-index:1; width:100%; min-height:clamp(150px,28vh,200px); display:flex; align-items:center; padding:20px 22px; border-radius:14px; text-align:start; font:inherit; font-weight:500; font-size:clamp(1.1rem,2.9vh,1.35rem); line-height:1.5; color:var(--ink); background:rgba(10,18,36,.92); border:1px solid rgba(216,180,106,.45); box-shadow:0 20px 50px rgba(0,0,0,.5); cursor:grab; touch-action:none; user-select:none; -webkit-user-select:none; transition:border-color .2s, opacity .2s; }
.tcard.sel{ border-color:var(--gold); box-shadow:0 0 0 2px var(--gold), 0 20px 50px rgba(0,0,0,.5); }
.tcard.lifting{ opacity:.2; }
.tcard[hidden]{ display:none; }
.dragghost{ position:fixed; left:0; top:0; z-index:50; margin:0; pointer-events:none; cursor:grabbing; transform-origin:top left; }
.dragghost.back{ transition:transform .32s cubic-bezier(.3,.7,.3,1); }
.left{ margin:0; color:var(--muted); font-size:.98rem; }
.hint{ margin:0; min-height:3em; font-size:1rem; color:var(--miss); line-height:1.45; }
.hint.info{ color:var(--muted); }

.targets{ --u:min(calc((100vh - var(--hh) - var(--fh) - 90px) / 2), 20vw, 220px); display:grid; grid-template-columns:repeat(3, var(--u)); gap:clamp(10px,2vh,18px) clamp(12px,1.8vw,22px); }
.target{ all:unset; cursor:pointer; display:flex; flex-direction:column; gap:6px; }
.target .frame{ position:relative; width:var(--u); aspect-ratio:1/1; border-radius:12px; overflow:hidden; border:1px solid var(--line); transition:border-color .2s, box-shadow .2s; }
.target img{ width:100%; height:100%; object-fit:cover; display:block; pointer-events:none; }
.target .nm{ font-weight:500; font-size:clamp(.95rem,2.3vh,1.05rem); display:flex; justify-content:space-between; gap:6px; align-items:center; }
.target .got{ font-size:.85rem; color:var(--gold); font-weight:500; }
.target.over .frame, .armed .target .frame{ border-color:rgba(216,180,106,.7); }
.target.over .frame{ box-shadow:0 0 0 2px var(--gold); }
.target.ok .frame{ animation:okf .9s ease; }
.target.no .frame{ animation:nof .7s ease; }
@keyframes okf{ 30%{ box-shadow:0 0 0 3px var(--gold), 0 0 24px rgba(216,180,106,.6); } }
@keyframes nof{ 25%,60%{ box-shadow:0 0 0 3px var(--miss); border-color:var(--miss); } }

/* ---------- Overlays ---------- */
.overlay{ position:fixed; inset:0; z-index:60; background:rgba(1,4,12,.6); display:flex; align-items:center; justify-content:center; padding:18px; }
.overlay[hidden]{ display:none; }
.pop{ width:min(460px,100%); background:rgba(8,15,30,.92); -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px); border:1px solid var(--line); border-radius:16px; padding:clamp(20px,3.5vw,30px); box-shadow:0 40px 90px rgba(0,0,0,.6); animation:pop .3s cubic-bezier(.2,.7,.2,1) both; }
.pop.wide{ width:min(540px,100%); }
@keyframes pop{ from{ opacity:0; transform:translateY(10px) scale(.98); } to{ opacity:1; transform:none; } }
.pop .tag{ margin:0 0 4px; color:var(--gold); font-weight:700; font-size:1.3rem; }
.pop h3{ margin:0 0 8px; font-weight:700; font-size:clamp(1.4rem,3.6vh,1.8rem); line-height:1.25; }
.pop p{ margin:0 0 20px; color:#d6deea; font-size:1.05rem; line-height:1.6; }
.pop .lead{ font-weight:500; color:var(--ink); font-size:1.15rem; }
.row{ display:flex; gap:10px; flex-wrap:wrap; }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

@media (max-width:820px){
  body{ overflow:auto; }
  .app{ height:auto; min-height:100vh; grid-template-rows:auto 1fr auto; padding-bottom:16px; }
  header{ flex-wrap:wrap; padding:12px 0; }
  main{ min-height:auto; }
  .view{ position:static; }
  .grid{ --t:calc((100vw - 64px) / 2); grid-template-columns:repeat(2, var(--t)); }
  .info{ grid-template-columns:1fr; }
  .imgbox{ height:auto; width:100%; max-width:100%; order:-1; }
  .icol{ max-width:none; height:auto; }
  .match{ grid-template-columns:1fr; }
  .targets{ --u:calc((100vw - 64px) / 3); }
  footer{ padding:12px 0; }
}
@media (prefers-reduced-motion: reduce){ *, *::before, *::after{ animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<div class="app">
  <header>
    <div>
      <h1 id="hTitle"></h1>
      <p class="sub" id="hSub"></p>
    </div>
    <div class="hside">
      <span class="count" id="hCount" aria-live="polite"></span>
      <button class="chip" id="fs" type="button"></button>
    </div>
  </header>

  <main>
    <!-- Stage 1: home -->
    <section class="view" id="vHome" aria-label="הכירו את הלוויינים">
      <div class="grid" id="grid"></div>
    </section>

    <!-- Stage 1: infographic -->
    <section class="view" id="vInfo" hidden>
      <div class="info" id="info">
        <div class="icol">
          <h2 id="iName" tabindex="-1"></h2>
          <ol class="parts" id="parts"></ol>
          <div class="summary" id="summary" hidden>
            <dl>
              <div><dt id="sUseL"></dt><dd id="sUse"></dd></div>
              <div><dt id="sHeightL"></dt><dd><div class="dist" id="sDist" aria-hidden="true"></div><span id="sHeight"></span></dd></div>
              <div><dt id="sExL"></dt><dd id="sEx"></dd></div>
            </dl>
          </div>
          <div class="extra" id="extra" hidden>
            <p class="intro" id="xIntro"></p>
            <h4 id="xResT"></h4>
            <div class="res">
              <canvas id="cvCivil" width="10" height="10" aria-hidden="true"></canvas><div><b id="xCivil"></b><span id="xCivilT"></span></div>
              <canvas id="cvMil" width="48" height="48" aria-hidden="true"></canvas><div><b id="xMil"></b><span id="xMilT"></span></div>
              <p class="px" id="xPx"></p>
            </div>
            <ul class="mil" id="xItems"></ul>
          </div>
          <div class="ictl">
            <button class="btn" id="iNext" type="button"></button>
            <button class="btn ghost" id="iMil" type="button" hidden></button>
            <button class="btn ghost" id="iAll" type="button"></button>
            <button class="btn ghost" id="iBack" type="button"></button>
          </div>
          <div class="editbox" id="editbox" hidden>
            <textarea id="editOut" readonly aria-label="קואורדינטות להעתקה"></textarea>
            <button class="btn ghost" id="editCopy" type="button">העתקה</button>
          </div>
        </div>
        <div class="imgbox" id="imgbox">
          <img id="iImg" alt=""><span class="credit" id="iCredit"></span>
          <div id="pdots"></div>
        </div>
        <svg id="lines" aria-hidden="true"></svg>
      </div>
    </section>

    <!-- Sort screen (optional) -->
    <section class="view" id="vSort" hidden>
      <div class="sort">
        <section aria-labelledby="sOrbT">
          <h2 id="sOrbT"></h2>
          <div class="scale" id="orbScale"></div>
          <div class="olist" id="olist"></div>
          <p class="webbnote" id="webbNote"></p>
        </section>
        <section aria-labelledby="sWT">
          <h2 id="sWT"></h2>
          <div class="scale" id="wScale"></div>
        </section>
      </div>
    </section>

    <!-- Stage 2 -->
    <section class="view" id="vMatch" hidden>
      <div class="match">
        <div class="deck">
          <p class="left" id="mLeft"></p>
          <div class="pile" id="pile">
            <button class="tcard" id="tcard" type="button"></button>
          </div>
          <p class="hint" id="mHint" aria-live="polite"></p>
        </div>
        <div class="targets" id="targets" role="group" aria-label="הלוויינים"></div>
      </div>
    </section>
  </main>

  <footer id="foot">
    <button class="btn ghost" id="toSort" type="button" hidden></button>
    <button class="btn" id="toStage2" type="button" disabled></button>
    <button class="link" id="skip" type="button"></button>
  </footer>
</div>

<div class="overlay" id="ok" hidden>
  <div class="pop" role="dialog" aria-modal="true" aria-labelledby="okTag">
    <p class="tag" id="okTag"></p>
    <h3 id="okSat"></h3>
    <p id="okWhy"></p>
    <button class="btn" id="okClose" type="button"></button>
  </div>
</div>

<div class="overlay" id="done" hidden>
  <div class="pop wide" role="dialog" aria-modal="true" aria-labelledby="dTitle">
    <h3 id="dTitle"></h3>
    <p class="lead" id="dText"></p>
    <div class="row">
      <button class="btn" id="dAgain" type="button"></button>
      <button class="btn ghost" id="dBack" type="button"></button>
    </div>
  </div>
</div>

<script>

<script>
const $ = id => document.getElementById(id);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const EDIT = /[?&]edit\b/.test(location.search) || location.search === '?edit';
const SATS = DATA.sats, byId = Object.fromEntries(SATS.map(s => [s.id, s]));
let view = 'home', seen = new Set();

/* ---------- static text ---------- */
$('hTitle').textContent = DATA.title;
$('toStage2').textContent = DATA.stage1.next;
$('skip').textContent = DATA.stage1.skip;
$('iAll').textContent = DATA.info.showAll;
$('iBack').textContent = DATA.info.back;
$('iMil').textContent = DATA.info.military; $('toSort').textContent = DATA.sort.open;
(function(){ const m = DATA.military;
  $('xIntro').textContent = m.intro; $('xResT').textContent = m.resTitle;
  $('xCivil').textContent = m.civil; $('xCivilT').textContent = m.civilText; $('xMil').textContent = m.mil; $('xMilT').textContent = m.milText; $('xPx').textContent = m.pixel;
  m.items.forEach(it => { const li = document.createElement('li'); li.innerHTML = '<b></b> '; li.firstChild.textContent = it.name + ':'; li.appendChild(document.createTextNode(it.text)); $('xItems').appendChild(li); });
})();
$('sUseL').textContent = DATA.info.use; $('sHeightL').textContent = DATA.info.height; $('sExL').textContent = DATA.info.example;
$('okTag').textContent = DATA.stage2.correct; $('okClose').textContent = DATA.stage2.cont;
$('dTitle').textContent = DATA.stage2.doneTitle; $('dText').textContent = DATA.stage2.doneText;
$('dAgain').textContent = DATA.stage2.again; $('dBack').textContent = DATA.stage2.back;

function show(v){
  view = v;
  $('vHome').hidden = v !== 'home'; $('vInfo').hidden = v !== 'info'; $('vMatch').hidden = v !== 'match'; $('vSort').hidden = v !== 'sort';
  $('foot').style.visibility = (v === 'home' || v === 'sort') ? 'visible' : 'hidden';
  if (v === 'home' || v === 'info'){
    $('hSub').textContent = DATA.stage1.instr;
    $('hCount').textContent = DATA.stage1.counter(seen.size, SATS.length);
  } else {
    $('hSub').textContent = DATA.stage2.instr;
  }
}

/* ---------- Stage 1: grid ---------- */
function renderGrid(){
  const g = $('grid'); g.innerHTML = '';
  SATS.forEach(s => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'thumb' + (seen.has(s.id) ? ' is-seen' : '');
    b.innerHTML = `<span class="frame"><img alt=""></span><span class="nm"><span></span></span>`;
    b.querySelector('img').src = IMAGES[s.id]; b.querySelector('img').alt = s.alt;
    b.querySelector('.nm span').textContent = s.name;
    if (seen.has(s.id)){ const m = document.createElement('span'); m.className = 'seen'; m.textContent = DATA.stage1.viewed; b.querySelector('.nm').appendChild(m); }
    b.setAttribute('aria-label', s.name + (seen.has(s.id) ? ', ' + DATA.stage1.viewed : ''));
    b.addEventListener('click', () => openInfo(s.id));
    g.appendChild(b);
  });
  $('toStage2').disabled = seen.size < SATS.length;
  $('skip').hidden = seen.size >= SATS.length;
  $('hCount').textContent = DATA.stage1.counter(seen.size, SATS.length);
}

/* ---------- Stage 1: infographic ---------- */
let cur = null, order = [], shown = 0, mode = 'parts', lastThumb = null;
function openInfo(id){
  cur = byId[id]; lastThumb = id;
  order = cur.parts.map((p,i) => i).sort((a,b) => cur.parts[a].y - cur.parts[b].y);
  shown = EDIT ? order.length : 1; mode = 'parts';
  $('iName').textContent = cur.name;
  $('iImg').src = IMAGES[id]; $('iImg').alt = cur.alt; $('iCredit').textContent = cur.credit || '';
  $('sUse').textContent = cur.summary.use; $('sEx').textContent = cur.summary.example;
  renderDist(cur.dist);
  const ol = $('parts'); ol.innerHTML = '';
  const pd = $('pdots'); pd.innerHTML = '';
  order.forEach((pi, k) => {
    const p = cur.parts[pi];
    const li = document.createElement('li'); li.className = 'part'; li.dataset.k = k;
    li.innerHTML = '<b></b><span></span>';
    li.querySelector('b').textContent = p.name;
    li.querySelector('span').textContent = p.text;
    ol.appendChild(li);
    const d = document.createElement('div'); d.className = 'pdot' + (p.inside ? ' inside' : ''); d.dataset.k = k;
    d.style.left = p.x + '%'; d.style.top = p.y + '%';
    if (EDIT) d.addEventListener('pointerdown', e => editDown(e, pi, d));
    pd.appendChild(d);
  });
  $('info').classList.toggle('edit', EDIT);
  $('editbox').hidden = !EDIT;
  show('info'); paintInfo();
  $('iName').focus({preventScroll:true});
  if (EDIT) updateEdit();
}
const LOGMIN = 100, LOGMAX = 40000;
const pKm = km => Math.max(0, Math.min(1, Math.log10(km / LOGMIN) / Math.log10(LOGMAX / LOGMIN)));
function renderDist(d){
  const box = $('sDist'), p = pKm(d.km);
  box.innerHTML = `<span class="trk"></span><span class="tick" style="--p:${pKm(2000)}"></span><span class="tick" style="--p:${pKm(35786)}"></span><span class="fill" style="--p:${p}"></span><span class="earth"></span><span class="sat" style="--p:${p}"></span>`;
  const o = DATA.orbits[d.orbit], t = $('sHeight'); t.innerHTML = '';
  t.appendChild(document.createTextNode(d.label + ' '));
  const orb = document.createElement('span'); orb.className = 'orb'; orb.textContent = `(${o.name}: ${o.short})`; t.appendChild(orb);
  if (d.note){ const n = document.createElement('span'); n.className = 'dist-note'; n.textContent = d.note; t.appendChild(n); }
  const ns = document.createElement('span'); ns.className = 'dist-note'; ns.textContent = DATA.info.notScale; t.appendChild(ns);
}
function drawRes(){
  const img = $('iImg');
  const go = () => [['cvCivil',10],['cvMil',48]].forEach(([id,n]) => {
    const c = $(id), x = c.getContext('2d'); c.width = n; c.height = n; x.imageSmoothingEnabled = true;
    const sw = img.naturalWidth * .22, sx = img.naturalWidth * .06, sy = img.naturalHeight * .72;
    x.drawImage(img, sx, sy, sw, sw, 0, 0, n, n);
  });
  if (img.complete) go(); else img.onload = go;
}
function paintInfo(){
  const done = shown >= order.length;
  [...$('parts').children].forEach((li,k) => {
    li.classList.toggle('off', k >= shown);
    li.classList.toggle('cur', k === shown - 1 && !done);
    li.setAttribute('aria-hidden', String(k >= shown));
  });
  const card = mode === 'summary' || mode === 'extra';
  [...$('pdots').children].forEach((d,k) => d.classList.toggle('off', k >= shown || card));
  $('parts').hidden = card;
  $('summary').hidden = mode !== 'summary';
  $('extra').hidden = mode !== 'extra';
  $('iMil').hidden = !(mode === 'summary' && cur.extra);
  const nx = $('iNext'), all = $('iAll');
  if (mode === 'extra'){
    nx.textContent = DATA.info.back; all.textContent = DATA.info.toSummary; all.hidden = false;
  } else if (mode === 'summary'){
    nx.textContent = DATA.info.back; all.textContent = DATA.info.toParts; all.hidden = false;
  } else if (!done){
    nx.textContent = DATA.info.nextPart; all.textContent = DATA.info.showAll; all.hidden = false;
  } else {
    nx.textContent = DATA.info.toSummary; all.hidden = true;
  }
  $('iBack').hidden = card;
  drawLines();
}
function drawLines(){
  const svg = $('lines'); svg.innerHTML = '';
  if (view !== 'info' || mode !== 'parts') return;
  const box = $('info').getBoundingClientRect(), img = $('iImg').getBoundingClientRect();
  [...$('parts').children].forEach((li,k) => {
    if (k >= shown) return;
    const p = cur.parts[order[k]], r = li.getBoundingClientRect();
    const x1 = img.left + img.width * p.x / 100 - box.left, y1 = img.top + img.height * p.y / 100 - box.top;
    const x2 = r.left - box.left, y2 = r.top + r.height / 2 - box.top;
    const l = document.createElementNS('http://www.w3.org/2000/svg','line');
    l.setAttribute('x1',x1); l.setAttribute('y1',y1); l.setAttribute('x2',x2); l.setAttribute('y2',y2);
    l.setAttribute('class', (p.inside ? 'dash ' : '') + (k === shown - 1 ? '' : 'dim'));
    svg.appendChild(l);
  });
}
$('iNext').addEventListener('click', () => {
  if (mode === 'summary' || mode === 'extra'){ backHome(); return; }
  if (shown < order.length){ shown++; paintInfo(); return; }
  mode = 'summary'; markSeen(cur.id); paintInfo();
});
$('iAll').addEventListener('click', () => {
  if (mode === 'extra'){ mode = 'summary'; paintInfo(); return; }
  if (mode === 'summary'){ mode = 'parts'; shown = order.length; paintInfo(); return; }
  shown = order.length; paintInfo();
});
$('iMil').addEventListener('click', () => { mode = 'extra'; paintInfo(); drawRes(); });
$('iBack').addEventListener('click', backHome);
function markSeen(id){ seen.add(id); $('hCount').textContent = DATA.stage1.counter(seen.size, SATS.length); }
function backHome(){
  show('home'); renderGrid();
  const t = [...$('grid').children][SATS.findIndex(s => s.id === lastThumb)]; if (t) t.focus({preventScroll:true});
}
new ResizeObserver(() => drawLines()).observe(document.body);
addEventListener('resize', drawLines);

/* calibration (?edit) */
function editDown(e, pi, dot){
  e.preventDefault(); dot.setPointerCapture(e.pointerId);
  const move = ev => {
    const r = $('iImg').getBoundingClientRect();
    const x = Math.max(0, Math.min(100, (ev.clientX - r.left) / r.width * 100));
    const y = Math.max(0, Math.min(100, (ev.clientY - r.top) / r.height * 100));
    cur.parts[pi].x = Math.round(x * 2) / 2; cur.parts[pi].y = Math.round(y * 2) / 2;
    dot.style.left = cur.parts[pi].x + '%'; dot.style.top = cur.parts[pi].y + '%';
    drawLines(); updateEdit();
  };
  const up = () => { dot.removeEventListener('pointermove', move); dot.removeEventListener('pointerup', up); };
  dot.addEventListener('pointermove', move); dot.addEventListener('pointerup', up);
}
function updateEdit(){
  $('editOut').value = cur.id + '\n' + cur.parts.map(p => `{ name: '${p.name}', x: ${p.x}, y: ${p.y} }`).join(',\n');
}
$('editCopy').addEventListener('click', () => { $('editOut').select(); try { navigator.clipboard.writeText($('editOut').value); } catch(e){ document.execCommand('copy'); } });

/* ---------- Stage 2 ---------- */
let queue, matched, counts, selected = false, drag = null, tries = 0;
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function startMatch(){
  queue = shuffle(DATA.tasks.map((_,i) => i)); matched = 0; counts = {}; tries = 0;
  $('done').hidden = true;
  show('match'); $('hTitle').textContent = DATA.stage2.title;
  try { window.parent.postMessage({ type: 'task-stage', id: 'l2-satellite-parts', step: 1 }, '*'); } catch(e){}
  renderTargets(); nextCard();
}
function renderTargets(){
  const t = $('targets'); t.innerHTML = '';
  SATS.forEach(s => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'target'; b.dataset.id = s.id;
    b.innerHTML = '<span class="frame"><img alt=""></span><span class="nm"><span></span><span class="got"></span></span>';
    b.querySelector('img').src = IMAGES[s.id];
    b.querySelector('.nm span').textContent = s.name;
    b.setAttribute('aria-label', s.name);
    b.addEventListener('click', () => { if (selected) attempt(s.id); });
    b.addEventListener('keydown', e => { if (e.key === 'Escape'){ unselect(); $('tcard').focus(); } });
    t.appendChild(b);
  });
  paintCounts();
}
function paintCounts(){
  [...$('targets').children].forEach(b => {
    const n = counts[b.dataset.id] || 0;
    b.querySelector('.got').textContent = n ? DATA.stage2.matched(n) : '';
  });
  $('hCount').textContent = DATA.stage2.counter(matched, DATA.tasks.length);
}
function nextCard(){
  const c = $('tcard'), pile = $('pile');
  tries = 0; $('mHint').textContent = ''; $('mHint').className = 'hint';
  if (!queue.length){ c.hidden = true; pile.classList.add('empty'); $('mLeft').textContent = ''; finish(); return; }
  c.hidden = false; c.classList.remove('lifting','sel');
  c.textContent = DATA.tasks[queue[0]].text;
  pile.classList.toggle('empty', queue.length === 1);
  pile.classList.toggle('one', queue.length === 2);
  $('mLeft').textContent = DATA.stage2.left(queue.length);
}
function selectCard(kb){
  selected = true; $('tcard').classList.add('sel'); $('targets').classList.add('armed');
  $('mHint').textContent = DATA.stage2.picked; $('mHint').className = 'hint info';
  if (kb) $('targets').firstElementChild.focus();
}
function unselect(){
  selected = false; $('tcard').classList.remove('sel'); $('targets').classList.remove('armed');
  if ($('mHint').classList.contains('info')) $('mHint').textContent = '';
}
function flash(el, cls){ el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); setTimeout(() => el.classList.remove(cls), 1000); }
function attempt(id){
  const t = DATA.tasks[queue[0]], el = $('targets').querySelector(`[data-id="${id}"]`);
  unselect();
  if (t.sat === id){
    matched++; counts[id] = (counts[id] || 0) + 1; paintCounts();
    if (el) flash(el, 'ok');
    $('okSat').textContent = byId[id].name; $('okWhy').textContent = t.why;
    $('tcard').hidden = true;
    $('ok').hidden = false; $('okClose').focus();
    return true;
  }
  tries++;
  if (el) flash(el, 'no');
  $('mHint').className = 'hint'; $('mHint').textContent = t.hint;
  return false;
}
function closeOk(){ $('ok').hidden = true; queue.shift(); nextCard(); if (queue.length) $('tcard').focus({preventScroll:true}); }
$('okClose').addEventListener('click', closeOk);
function finish(){
  $('done').hidden = false; $('dAgain').focus();
  try { window.parent.postMessage(DATA.doneMessage, '*'); } catch(e){}
}
$('dAgain').addEventListener('click', startMatch);
$('dBack').addEventListener('click', () => { $('done').hidden = true; $('hTitle').textContent = DATA.title; $('toStage2').hidden = false; backHome(); });

/* drag */
$('tcard').addEventListener('pointerdown', e => {
  if (e.button !== undefined && e.button !== 0) return;
  e.preventDefault();
  drag = { x0:e.clientX, y0:e.clientY, moved:false, over:null };
  addEventListener('pointermove', onMove); addEventListener('pointerup', onUp, { once:true }); addEventListener('pointercancel', onCancel, { once:true });
});
$('tcard').addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); selected ? unselect() : selectCard(true); }
  if (e.key === 'Escape') unselect();
});
function onMove(e){
  if (!drag) return;
  const c = $('tcard');
  if (!drag.moved){
    if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 6) return;
    drag.moved = true; unselect();
    const r = c.getBoundingClientRect();
    const g = c.cloneNode(true); g.removeAttribute('id'); g.classList.add('dragghost'); g.classList.remove('sel');
    g.style.width = r.width + 'px'; g.style.minHeight = '0'; g.style.height = r.height + 'px';
    drag.ox = drag.x0 - r.left; drag.oy = drag.y0 - r.top; drag.home = r; drag.g = g;
    document.body.appendChild(g); c.classList.add('lifting');
  }
  drag.g.style.transform = `translate(${e.clientX - drag.ox}px, ${e.clientY - drag.oy}px) scale(.7) rotate(-2deg)`;
  const hit = document.elementFromPoint(e.clientX, e.clientY);
  const over = hit ? hit.closest('.target') : null;
  if (over !== drag.over){ if (drag.over) drag.over.classList.remove('over'); if (over) over.classList.add('over'); drag.over = over; }
}
function onUp(){
  removeEventListener('pointermove', onMove); removeEventListener('pointercancel', onCancel);
  if (!drag) return;
  const d = drag; drag = null;
  if (!d.moved){ selected ? unselect() : selectCard(false); return; }
  if (d.over){ d.over.classList.remove('over'); if (attempt(d.over.dataset.id)){ d.g.remove(); $('tcard').classList.remove('lifting'); return; } }
  sendBack(d);
}
function onCancel(){ removeEventListener('pointermove', onMove); removeEventListener('pointerup', onUp); if (drag && drag.moved) sendBack(drag); drag = null; }
function sendBack(d){
  const c = $('tcard');
  if (reduce){ d.g.remove(); c.classList.remove('lifting'); return; }
  d.g.classList.add('back');
  requestAnimationFrame(() => { d.g.style.transform = `translate(${d.home.left}px, ${d.home.top}px) scale(1)`; });
  setTimeout(() => { d.g.remove(); c.classList.remove('lifting'); }, 340);
}

/* ---------- navigation & keys ---------- */
$('toStage2').addEventListener('click', startMatch);
$('toSort').addEventListener('click', () => view === 'sort' ? (closeSort()) : openSort());
function closeSort(){ $('hTitle').textContent = DATA.title; $('toStage2').hidden = false; $('toSort').textContent = DATA.sort.open; backHome(); }
function openSort(){
  show('sort');
  $('hTitle').textContent = DATA.sort.title; $('hSub').textContent = DATA.sort.instr; $('hCount').textContent = '';
  $('sOrbT').textContent = DATA.sort.byOrbit; $('sWT').textContent = DATA.sort.byWeight; $('webbNote').textContent = DATA.sort.webb;
  const S = $('orbScale');
  const z = (cls, a, b) => `<span class="zone ${cls}" style="right:${a*100}%;width:${(b-a)*100}%"></span>`;
  const g = pKm(35786), m = pKm(2000);
  let h = '<span class="trk"></span>' + z('low',0,m) + z('mid',m,g-.004) + z('geo',g-.006,g+.006);
  h += `<span class="earthbig"></span><span class="earthlbl">${DATA.info.earth}</span>`;
  h += `<span class="zl" style="right:${m/2*100}%">${DATA.orbits.low.name}</span><span class="zl" style="right:${(m+g)/2*100}%">${DATA.orbits.mid.name}</span><span class="zl" style="right:${g*100}%;transform:translateX(70%)">${DATA.orbits.geo.name}</span>`;
  S.innerHTML = h;
  DATA.sort.orbitMarks.forEach(k => S.appendChild(mark(pKm(k.km), k.row, k.name)));
  const ol = $('olist'); ol.innerHTML = '';
  ['low','mid','geo'].forEach(k => { const d = document.createElement('div'); d.className = k; d.innerHTML = '<b></b><span></span>'; d.firstChild.textContent = DATA.orbits[k].name; d.lastChild.textContent = DATA.orbits[k].long; ol.appendChild(d); });
  const W = $('wScale'), pW = kg => Math.log10(Math.max(kg,1)) / Math.log10(12000);
  W.innerHTML = `<span class="trk"></span><span class="zl" style="right:0;transform:none">${DATA.sort.wMin}</span><span class="zl" style="right:${pW(10000)*100}%">${DATA.sort.wMax}</span>`;
  DATA.sort.weightMarks.forEach(k => W.appendChild(mark(pW(k.kg), k.row, k.name, k.val)));
  $('foot').style.visibility = 'visible'; $('toStage2').hidden = true; $('skip').hidden = true;
  $('toSort').textContent = DATA.sort.back;
}
function mark(p, row, name, val){
  const el = document.createElement('div'); el.className = 'mk' + (p > .9 ? ' edge' : p < .05 ? ' start' : '');
  el.style.right = (p * 100) + '%';
  const h = 22 + row * 24;
  el.innerHTML = `<i style="height:${h}px"></i><em></em><span style="bottom:${h + 2}px"></span>`;
  const sp = el.querySelector('span'); sp.textContent = name;
  if (val){ const sm = document.createElement('small'); sm.textContent = ' · ' + val; sp.appendChild(sm); }
  return el;
}
$('skip').addEventListener('click', startMatch);
addEventListener('keydown', e => {
  if (!$('ok').hidden && (e.key === 'Enter' || e.key === 'Escape')){ e.preventDefault(); closeOk(); return; }
  if (!$('done').hidden && e.key === 'Escape'){ $('done').hidden = true; return; }
  if (view === 'info' && e.key === 'Escape'){ backHome(); }
  if (view === 'sort' && e.key === 'Escape'){ closeSort(); }
});

/* ---------- fullscreen ---------- */
function fsLabel(){ $('fs').textContent = document.fullscreenElement ? DATA.exitFullscreen : DATA.fullscreen; }
$('fs').addEventListener('click', () => {
  try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); } catch(e){}
});
document.addEventListener('fullscreenchange', () => { fsLabel(); setTimeout(drawLines, 120); });
if (!document.fullscreenEnabled) $('fs').hidden = true;

/* ---------- stars ---------- */
(function(){
  const cv = $('stars'), cx = cv.getContext('2d');
  function draw(){
    const d = Math.min(devicePixelRatio || 1, 2), W = innerWidth, H = innerHeight;
    cv.width = W * d; cv.height = H * d; cx.setTransform(d,0,0,d,0,0);
    const g = cx.createRadialGradient(W*.7, H*.1, 0, W*.7, H*.1, Math.max(W,H)*.8);
    g.addColorStop(0, 'rgba(30,50,100,.18)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    cx.fillStyle = g; cx.fillRect(0,0,W,H);
    let s = 7; const R = () => (s = (s * 16807) % 2147483647) / 2147483647;
    const n = Math.round(W * H / 2600);
    for (let i = 0; i < n; i++){
      const a = .15 + R() * .55, r = R() < .97 ? .3 + R() * .7 : 1.1 + R() * .6;
      cx.fillStyle = `rgba(${R() < .8 ? '220,230,255' : '255,232,205'},${a})`;
      cx.beginPath(); cx.arc(R() * W, R() * H, r, 0, 6.283); cx.fill();
    }
  }
  draw(); let t; addEventListener('resize', () => { clearTimeout(t); t = setTimeout(draw, 150); });
})();

fsLabel(); show('home'); renderGrid();
</script>
